<svg xmlns="http://www.w3.org/2000/svg" width="400" height="490" viewBox="0 0 400 490"><rect width="400" height="490" rx="16" fill="#eff6ff"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="24" y="42" font-size="24" font-weight="700" fill="#172554">빈 행 삭제 기준</text><rect x="16" y="66" width="368" height="112" rx="12" fill="white"/><circle cx="44" cy="97" r="16" fill="#2563eb"/><text x="44" y="103" text-anchor="middle" fill="white" font-size="18">1</text><text x="72" y="102" font-size="21" fill="#172554" font-weight="700">A열만 빈 경우</text><text x="72" y="130" font-size="19" fill="#475569" font-weight="400">옆 열에 값이 있으면</text><text x="72" y="158" font-size="19" fill="#475569" font-weight="400">행 전체 삭제 전 확인</text><rect x="16" y="194" width="368" height="112" rx="12" fill="white"/><circle cx="44" cy="225" r="16" fill="#2563eb"/><text x="44" y="231" text-anchor="middle" fill="white" font-size="18">2</text><text x="72" y="230" font-size="21" fill="#172554" font-weight="700">A~D열이 모두 빈 경우</text><text x="72" y="258" font-size="19" fill="#475569" font-weight="400">COUNTA 결과가 0인 행만</text><text x="72" y="286" font-size="19" fill="#475569" font-weight="400">골라서 확인</text><rect x="16" y="322" width="368" height="112" rx="12" fill="white"/><circle cx="44" cy="353" r="16" fill="#2563eb"/><text x="44" y="359" text-anchor="middle" fill="white" font-size="18">3</text><text x="72" y="358" font-size="21" fill="#172554" font-weight="700">보이는 셀만 선택</text><text x="72" y="386" font-size="19" fill="#475569" font-weight="400">헤더 제외 → Alt + ;</text><text x="72" y="414" font-size="19" fill="#475569" font-weight="400">삭제할 행 확인</text></g></svg>