<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620" role="img" aria-labelledby="t d"><title id="t">Firefly 할인과 생성 기능 구분</title><desc id="d">첫 12개월 할인과 표준 생성 무제한, 프리미엄 기능 월별 크레딧을 설명한 모바일 도식</desc><rect width="440" height="620" rx="22" fill="#fff7ed"/><rect x="20" y="22" width="400" height="94" rx="16" fill="#ef4444"/><text x="220" y="61" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="white">Firefly 50% 할인</text><text x="220" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="white">첫 12개월 · 2026년 10월 7일까지</text><rect x="20" y="140" width="400" height="182" rx="18" fill="white" stroke="#fdba74" stroke-width="2"/><text x="220" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#9a3412">표준 생성 기능</text><text x="220" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#431407">이미지 · 생성형 채우기 · 벡터</text><rect x="115" y="239" width="210" height="48" rx="24" fill="#ffedd5"/><text x="220" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#c2410c">무제한 이용</text><rect x="20" y="344" width="400" height="182" rx="18" fill="white" stroke="#c4b5fd" stroke-width="2"/><text x="220" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#5b21b6">프리미엄 기능</text><text x="220" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#2e1065">영상 · 오디오 · 번역 · 파트너 모델</text><rect x="105" y="443" width="230" height="48" rx="24" fill="#ede9fe"/><text x="220" y="474" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#6d28d9">월별 크레딧 사용</text><text x="220" y="567" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#7c2d12">12개월 약정 · 정상가 자동 갱신</text></svg>
