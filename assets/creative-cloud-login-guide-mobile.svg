<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620"><rect width="440" height="620" rx="22" fill="#f8fafc"/><text x="220" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#1e293b">Creative Cloud 로그인 오류</text><g font-family="Arial,sans-serif"><g transform="translate(28 78)"><rect width="384" height="82" rx="15" fill="#fee2e2"/><text x="22" y="35" font-size="19" font-weight="700" fill="#991b1b">1. Adobe 서버 상태</text><text x="22" y="61" font-size="15" fill="#7f1d1d">여러 서비스가 동시에 안 되는지 확인</text></g><g transform="translate(28 178)"><rect width="384" height="82" rx="15" fill="#ffedd5"/><text x="22" y="35" font-size="19" font-weight="700" fill="#9a3412">2. 앱 종료·공식 업데이트</text><text x="22" y="61" font-size="15" fill="#7c2d12">구버전과 멈춘 프로세스 분리</text></g><g transform="translate(28 278)"><rect width="384" height="82" rx="15" fill="#dbeafe"/><text x="22" y="35" font-size="19" font-weight="700" fill="#1e40af">3. 다른 네트워크 비교</text><text x="22" y="61" font-size="15" fill="#1e3a8a">VPN·프록시·회사 방화벽 확인</text></g><g transform="translate(28 378)"><rect width="384" height="82" rx="15" fill="#ede9fe"/><text x="22" y="35" font-size="19" font-weight="700" fill="#5b21b6">4. 오류 문구별 처리</text><text x="22" y="61" font-size="15" fill="#4c1d95">OOBE 캐시 또는 활성화 기기</text></g><rect x="28" y="490" width="384" height="82" rx="15" fill="white" stroke="#cbd5e1"/><text x="220" y="523" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">삭제·재설치는 마지막에</text><text x="220" y="550" text-anchor="middle" font-size="14" fill="#475569">계정과 동기화 상태부터 확인</text></g></svg>
