<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">ChatGPT 음성모드 마이크 점검</title><desc id="d">음소거와 앱 또는 사이트 권한, 운영체제 권한, 입력 장치를 순서대로 확인하는 흐름</desc><rect width="800" height="430" rx="24" fill="#f3f8f6"/><g font-family="Arial,sans-serif" fill="#17223b"><text x="400" y="49" text-anchor="middle" font-size="25" font-weight="700">ChatGPT가 못 들으면 권한을 층별로 확인</text><rect x="255" y="76" width="290" height="60" rx="16" fill="#fff" stroke="#10a37f" stroke-width="3"/><text x="400" y="113" text-anchor="middle" font-size="18" font-weight="700">1. 음소거 · 물리 스위치</text><path d="M400 136v35M115 171h570M115 171v34M400 171v34M685 171v34" stroke="#7d879a" stroke-width="3" fill="none"/><rect x="25" y="205" width="180" height="100" rx="17" fill="#e8f7ed" stroke="#42a364" stroke-width="2"/><text x="115" y="241" text-anchor="middle" font-size="17" font-weight="700">모바일 앱</text><text x="115" y="271" text-anchor="middle" font-size="14">ChatGPT 마이크 권한</text><rect x="310" y="205" width="180" height="100" rx="17" fill="#e8f1ff" stroke="#4b83d1" stroke-width="2"/><text x="400" y="241" text-anchor="middle" font-size="17" font-weight="700">웹 브라우저</text><text x="400" y="271" text-anchor="middle" font-size="14">chatgpt.com 사이트 권한</text><rect x="595" y="205" width="180" height="100" rx="17" fill="#fff1dc" stroke="#d68a28" stroke-width="2"/><text x="685" y="241" text-anchor="middle" font-size="17" font-weight="700">운영체제</text><text x="685" y="271" text-anchor="middle" font-size="14">Windows · iOS · Android</text><path d="M115 305v35M400 305v35M685 305v35M115 340h570" stroke="#7d879a" stroke-width="3" fill="none"/><rect x="220" y="340" width="360" height="62" rx="16" fill="#fff" stroke="#7d879a" stroke-width="2"/><text x="400" y="367" text-anchor="middle" font-size="17" font-weight="700">입력 장치 → 업데이트 → 재시작</text><text x="400" y="389" text-anchor="middle" font-size="13">한도 안내가 있으면 초기화 대기</text></g></svg>
