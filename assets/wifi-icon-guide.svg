<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">Windows 11 Wi-Fi 아이콘 진단</title><desc id="d">빠른 설정, 어댑터, WLAN 서비스를 차례로 확인하는 흐름</desc><rect width="800" height="430" rx="24" fill="#f6f8fb"/><g font-family="Arial,sans-serif" fill="#17223b"><text x="400" y="48" text-anchor="middle" font-size="25" font-weight="700">Wi-Fi가 어디서 사라졌나요?</text><rect x="245" y="74" width="310" height="62" rx="16" fill="#fff" stroke="#5975d9" stroke-width="3"/><text x="400" y="111" text-anchor="middle" font-size="18" font-weight="700">Win + A 빠른 설정 확인</text><path d="M400 136v34M130 170h540M130 170v35M400 170v35M670 170v35" stroke="#7d879a" stroke-width="3" fill="none"/><rect x="35" y="205" width="190" height="94" rx="16" fill="#e8f1ff" stroke="#4b83d1" stroke-width="2"/><text x="130" y="240" text-anchor="middle" font-size="18" font-weight="700">버튼만 없음</text><text x="130" y="269" text-anchor="middle" font-size="14">빠른 설정·어댑터 확인</text><rect x="305" y="205" width="190" height="94" rx="16" fill="#fff1dc" stroke="#d68a28" stroke-width="2"/><text x="400" y="240" text-anchor="middle" font-size="18" font-weight="700">목록이 비어 있음</text><text x="400" y="269" text-anchor="middle" font-size="14">비행기 모드·공유기 확인</text><rect x="575" y="205" width="190" height="94" rx="16" fill="#fbeaec" stroke="#cb5968" stroke-width="2"/><text x="670" y="240" text-anchor="middle" font-size="18" font-weight="700">어댑터도 없음</text><text x="670" y="269" text-anchor="middle" font-size="14">드라이버·하드웨어 확인</text><path d="M130 299v35M400 299v35M670 299v35M130 334h540" stroke="#7d879a" stroke-width="3" fill="none"/><rect x="145" y="334" width="510" height="63" rx="16" fill="#e8f7ed" stroke="#42a364" stroke-width="2"/><text x="400" y="360" text-anchor="middle" font-size="17" font-weight="700">쉬운 조치부터 한 단계씩 재확인</text><text x="400" y="383" text-anchor="middle" font-size="14">네트워크 초기화는 마지막 수단</text></g></svg>
