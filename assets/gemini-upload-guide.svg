<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">Gemini 파일 업로드 오류 진단</title><desc id="d">파일 기준, 사용량 한도, 저장공간, 계정 권한을 순서대로 확인하는 흐름</desc><rect width="800" height="430" rx="24" fill="#f6f8fb"/><g font-family="Arial,sans-serif" fill="#17223b"><text x="400" y="48" text-anchor="middle" font-size="25" font-weight="700">Gemini 파일 업로드, 문구부터 확인</text><rect x="245" y="74" width="310" height="62" rx="16" fill="#fff" stroke="#6b5ce7" stroke-width="3"/><text x="400" y="111" text-anchor="middle" font-size="18" font-weight="700">새 채팅에 작은 파일 1개</text><path d="M400 136v34M100 170h600M100 170v35M300 170v35M500 170v35M700 170v35" stroke="#7d879a" stroke-width="3" fill="none"/><rect x="18" y="205" width="164" height="94" rx="16" fill="#e8f1ff" stroke="#4b83d1" stroke-width="2"/><text x="100" y="240" text-anchor="middle" font-size="17" font-weight="700">파일 기준</text><text x="100" y="269" text-anchor="middle" font-size="13">개수·용량·ZIP</text><rect x="218" y="205" width="164" height="94" rx="16" fill="#fff1dc" stroke="#d68a28" stroke-width="2"/><text x="300" y="240" text-anchor="middle" font-size="17" font-weight="700">사용량</text><text x="300" y="269" text-anchor="middle" font-size="13">시간 뒤 재시도</text><rect x="418" y="205" width="164" height="94" rx="16" fill="#fbeaec" stroke="#cb5968" stroke-width="2"/><text x="500" y="240" text-anchor="middle" font-size="17" font-weight="700">저장공간</text><text x="500" y="269" text-anchor="middle" font-size="13">활동 검토·정리</text><rect x="618" y="205" width="164" height="94" rx="16" fill="#e8f7ed" stroke="#42a364" stroke-width="2"/><text x="700" y="240" text-anchor="middle" font-size="17" font-weight="700">계정 권한</text><text x="700" y="269" text-anchor="middle" font-size="13">관리자·Drive</text><path d="M100 299v35M300 299v35M500 299v35M700 299v35M100 334h600" stroke="#7d879a" stroke-width="3" fill="none"/><rect x="145" y="334" width="510" height="63" rx="16" fill="#fff" stroke="#7d879a" stroke-width="2"/><text x="400" y="360" text-anchor="middle" font-size="17" font-weight="700">원본 대신 필요한 부분만 담은 사본 사용</text><text x="400" y="383" text-anchor="middle" font-size="14">민감정보를 가리고 다시 업로드</text></g></svg>
