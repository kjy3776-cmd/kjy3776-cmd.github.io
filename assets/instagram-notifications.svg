<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">인스타그램 알림 점검 순서</title><desc id="d">앱 내부 설정과 휴대폰 권한, 집중 모드를 차례로 확인하는 흐름</desc><rect width="800" height="430" rx="24" fill="#f7f5fb"/><g font-family="Arial,sans-serif" fill="#17223b"><text x="400" y="50" text-anchor="middle" font-size="25" font-weight="700">인스타그램 알림, 두 설정을 모두 확인</text><rect x="70" y="90" width="290" height="115" rx="20" fill="#fff" stroke="#a855f7" stroke-width="3"/><text x="215" y="130" text-anchor="middle" font-size="20" font-weight="700">1. Instagram 앱</text><text x="215" y="162" text-anchor="middle" font-size="15">전체 일시 중지 · DM · 댓글</text><text x="215" y="185" text-anchor="middle" font-size="15">계정별 알림</text><rect x="440" y="90" width="290" height="115" rx="20" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="585" y="130" text-anchor="middle" font-size="20" font-weight="700">2. 휴대폰 설정</text><text x="585" y="162" text-anchor="middle" font-size="15">알림 허용 · 배너 · 소리</text><text x="585" y="185" text-anchor="middle" font-size="15">앱별 알림 카테고리</text><path d="M215 205v45M585 205v45M215 250h370" stroke="#7d879a" stroke-width="3" fill="none"/><rect x="200" y="250" width="400" height="82" rx="18" fill="#fff4df" stroke="#d68a28" stroke-width="2"/><text x="400" y="283" text-anchor="middle" font-size="19" font-weight="700">3. 집중 모드 · 방해 금지 확인</text><text x="400" y="311" text-anchor="middle" font-size="15">잠시 끄고 시험 DM 받기</text><path d="M400 332v25" stroke="#7d879a" stroke-width="3"/><rect x="250" y="357" width="300" height="48" rx="15" fill="#e8f7ed" stroke="#42a364" stroke-width="2"/><text x="400" y="388" text-anchor="middle" font-size="17" font-weight="700">업데이트 → 재시작 → 재로그인</text></g></svg>
