<svg xmlns="http://www.w3.org/2000/svg" width="400" height="620" viewBox="0 0 400 620" role="img" aria-labelledby="t d"><title id="t">Wi-Fi 아이콘 모바일 진단</title><desc id="d">Wi-Fi가 사라진 위치별 조치를 보여주는 세로 흐름</desc><rect width="400" height="620" rx="22" fill="#f6f8fb"/><g font-family="Arial,sans-serif" fill="#17223b"><text x="200" y="42" text-anchor="middle" font-size="21" font-weight="700">Wi-Fi가 어디서 사라졌나요?</text><rect x="55" y="68" width="290" height="66" rx="16" fill="#fff" stroke="#5975d9" stroke-width="3"/><text x="200" y="108" text-anchor="middle" font-size="17" font-weight="700">Win + A 빠른 설정</text><path d="M200 134v26M200 258v26M200 382v26M200 506v26" stroke="#7d879a" stroke-width="3"/><rect x="45" y="160" width="310" height="98" rx="16" fill="#e8f1ff" stroke="#4b83d1" stroke-width="2"/><text x="200" y="198" text-anchor="middle" font-size="17" font-weight="700">버튼만 없다면</text><text x="200" y="229" text-anchor="middle" font-size="14">빠른 설정·어댑터 확인</text><rect x="45" y="284" width="310" height="98" rx="16" fill="#fff1dc" stroke="#d68a28" stroke-width="2"/><text x="200" y="322" text-anchor="middle" font-size="17" font-weight="700">목록이 비었다면</text><text x="200" y="353" text-anchor="middle" font-size="14">비행기 모드·공유기 확인</text><rect x="45" y="408" width="310" height="98" rx="16" fill="#fbeaec" stroke="#cb5968" stroke-width="2"/><text x="200" y="446" text-anchor="middle" font-size="17" font-weight="700">어댑터도 없다면</text><text x="200" y="477" text-anchor="middle" font-size="14">드라이버·하드웨어 확인</text><rect x="45" y="532" width="310" height="58" rx="16" fill="#e8f7ed" stroke="#42a364" stroke-width="2"/><text x="200" y="568" text-anchor="middle" font-size="14" font-weight="700">네트워크 초기화는 마지막 수단</text></g></svg>
