<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420"><rect width="800" height="420" rx="20" fill="#eff6ff"/><g font-family="Malgun Gothic,Arial,sans-serif"><text x="36" y="52" font-size="26" font-weight="700" fill="#172554">HEIC → JPG, 파일 위치로 방법 선택</text><rect x="32" y="80" width="736" height="76" rx="12" fill="white"/><circle cx="66" cy="118" r="20" fill="#2563eb"/><text x="66" y="125" text-anchor="middle" fill="white" font-size="20">1</text><text x="104" y="111" fill="#172554" font-size="21" font-weight="700">PC에 사진이 있음</text><text x="104" y="139" fill="#475569" font-size="18">iMazing Converter → 파일 추가 → JPEG → Convert</text><rect x="32" y="172" width="736" height="76" rx="12" fill="white"/><circle cx="66" cy="210" r="20" fill="#2563eb"/><text x="66" y="217" text-anchor="middle" fill="white" font-size="20">2</text><text x="104" y="203" fill="#172554" font-size="21" font-weight="700">iCloud 사진에 있음</text><text x="104" y="231" fill="#475569" font-size="18">사진 선택 → 추가 다운로드 옵션 → 호환성 우선</text><rect x="32" y="264" width="736" height="76" rx="12" fill="white"/><circle cx="66" cy="302" r="20" fill="#2563eb"/><text x="66" y="309" text-anchor="middle" fill="white" font-size="20">3</text><text x="104" y="295" fill="#172554" font-size="21" font-weight="700">변환 후 확인</text><text x="104" y="323" fill="#475569" font-size="18">JPG 열기 → 방향·화질·장수 확인 → 원본은 보관</text><text x="36" y="394" font-size="16" fill="#475569">막힘해결 · 단계별 설명 도식</text></g></svg>