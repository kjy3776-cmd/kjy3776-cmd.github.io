<svg xmlns="http://www.w3.org/2000/svg" width="400" height="620" viewBox="0 0 400 620" role="img" aria-labelledby="t d"><title id="t">인스타그램 알림 모바일 점검</title><desc id="d">앱과 휴대폰 알림 설정을 세로로 확인하는 흐름</desc><rect width="400" height="620" rx="22" fill="#f7f5fb"/><g font-family="Arial,sans-serif" fill="#17223b"><text x="200" y="43" text-anchor="middle" font-size="20" font-weight="700">인스타그램 알림 점검</text><rect x="40" y="76" width="320" height="120" rx="18" fill="#fff" stroke="#a855f7" stroke-width="3"/><text x="200" y="115" text-anchor="middle" font-size="18" font-weight="700">1. Instagram 앱</text><text x="200" y="148" text-anchor="middle" font-size="14">전체 일시 중지 · DM · 댓글</text><text x="200" y="172" text-anchor="middle" font-size="14">계정별 알림 확인</text><path d="M200 196v30M200 346v30M200 486v30" stroke="#7d879a" stroke-width="3"/><rect x="40" y="226" width="320" height="120" rx="18" fill="#fff" stroke="#3b82f6" stroke-width="3"/><text x="200" y="265" text-anchor="middle" font-size="18" font-weight="700">2. 휴대폰 설정</text><text x="200" y="298" text-anchor="middle" font-size="14">알림 허용 · 배너 · 소리</text><text x="200" y="322" text-anchor="middle" font-size="14">앱별 알림 카테고리</text><rect x="40" y="376" width="320" height="110" rx="18" fill="#fff4df" stroke="#d68a28" stroke-width="2"/><text x="200" y="417" text-anchor="middle" font-size="18" font-weight="700">3. 집중 모드 확인</text><text x="200" y="450" text-anchor="middle" font-size="14">잠시 끄고 시험 DM 받기</text><rect x="40" y="516" width="320" height="70" rx="18" fill="#e8f7ed" stroke="#42a364" stroke-width="2"/><text x="200" y="545" text-anchor="middle" font-size="16" font-weight="700">업데이트 → 재시작</text><text x="200" y="570" text-anchor="middle" font-size="15">마지막에 재로그인·재설치</text></g></svg>
