<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">Chrome 메모리 진단 순서</title><desc id="d">큰 항목이 탭인지 확장인지 전체인지 구분하는 흐름</desc><rect width="800" height="430" rx="24" fill="#f6f8fb"/><g font-family="Arial,sans-serif"><text x="400" y="47" text-anchor="middle" font-size="25" font-weight="700" fill="#17223b">Chrome 메모리, 원인부터 나누세요</text><rect x="250" y="72" width="300" height="64" rx="16" fill="#fff" stroke="#5b6ee1" stroke-width="3"/><text x="400" y="99" text-anchor="middle" font-size="17" font-weight="700">Shift + Esc</text><text x="400" y="122" text-anchor="middle" font-size="15">Chrome 작업 관리자</text><path d="M400 136v35M135 171h530M135 171v37M400 171v37M665 171v37" stroke="#77839a" stroke-width="3" fill="none"/><rect x="38" y="208" width="194" height="90" rx="16" fill="#e8f1ff" stroke="#4b83d1" stroke-width="2"/><text x="135" y="240" text-anchor="middle" font-size="18" font-weight="700">특정 탭이 큼</text><text x="135" y="268" text-anchor="middle" font-size="15">저장 → 새로고침</text><rect x="303" y="208" width="194" height="90" rx="16" fill="#fff1dc" stroke="#d68a28" stroke-width="2"/><text x="400" y="240" text-anchor="middle" font-size="18" font-weight="700">확장 기능이 큼</text><text x="400" y="268" text-anchor="middle" font-size="15">끄고 하나씩 확인</text><rect x="568" y="208" width="194" height="90" rx="16" fill="#e8f7ed" stroke="#42a364" stroke-width="2"/><text x="665" y="240" text-anchor="middle" font-size="18" font-weight="700">전체가 큼</text><text x="665" y="268" text-anchor="middle" font-size="15">메모리 절약 → 업데이트</text><path d="M135 298v35M400 298v35M665 298v35M135 333h530" stroke="#77839a" stroke-width="3" fill="none"/><rect x="150" y="333" width="500" height="62" rx="16" fill="#fff" stroke="#77839a" stroke-width="2"/><text x="400" y="360" text-anchor="middle" font-size="17" font-weight="700">한 단계씩 적용하고 다시 비교</text><text x="400" y="383" text-anchor="middle" font-size="14">해결되지 않을 때만 설정 초기화</text></g></svg>
