<svg xmlns="http://www.w3.org/2000/svg" width="400" height="620" viewBox="0 0 400 620" role="img" aria-labelledby="t d"><title id="t">Chrome 메모리 모바일 진단</title><desc id="d">Chrome 작업 관리자에서 원인을 확인하는 세로 흐름</desc><rect width="400" height="620" rx="22" fill="#f6f8fb"/><g font-family="Arial,sans-serif"><text x="200" y="42" text-anchor="middle" font-size="21" font-weight="700">Chrome 메모리 진단</text><rect x="65" y="68" width="270" height="70" rx="16" fill="#fff" stroke="#5b6ee1" stroke-width="3"/><text x="200" y="99" text-anchor="middle" font-size="17" font-weight="700">Shift + Esc</text><text x="200" y="122" text-anchor="middle" font-size="14">Chrome 작업 관리자</text><path d="M200 138v28M200 252v28M200 366v28M200 480v28" stroke="#77839a" stroke-width="3"/><rect x="45" y="166" width="310" height="86" rx="16" fill="#e8f1ff" stroke="#4b83d1" stroke-width="2"/><text x="200" y="200" text-anchor="middle" font-size="17" font-weight="700">특정 탭이 크다면</text><text x="200" y="228" text-anchor="middle" font-size="14">저장 → 새로고침 또는 종료</text><rect x="45" y="280" width="310" height="86" rx="16" fill="#fff1dc" stroke="#d68a28" stroke-width="2"/><text x="200" y="314" text-anchor="middle" font-size="17" font-weight="700">확장 기능이 크다면</text><text x="200" y="342" text-anchor="middle" font-size="14">끄고 하나씩 다시 켜기</text><rect x="45" y="394" width="310" height="86" rx="16" fill="#e8f7ed" stroke="#42a364" stroke-width="2"/><text x="200" y="428" text-anchor="middle" font-size="17" font-weight="700">전체가 크다면</text><text x="200" y="456" text-anchor="middle" font-size="14">메모리 절약 → 업데이트</text><rect x="45" y="508" width="310" height="76" rx="16" fill="#fff" stroke="#77839a" stroke-width="2"/><text x="200" y="540" text-anchor="middle" font-size="16" font-weight="700">적용 후 같은 작업으로 비교</text><text x="200" y="566" text-anchor="middle" font-size="13">마지막 수단: 설정 초기화</text></g></svg>
