<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">Firefly 할인과 생성 기능 구분</title><desc id="d">첫 12개월 50퍼센트 할인과 표준 생성 무제한, 프리미엄 기능 월별 크레딧을 설명한 도식</desc><rect width="800" height="430" rx="24" fill="#fff7ed"/><rect x="32" y="30" width="736" height="76" rx="16" fill="#ef4444"/><text x="400" y="64" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="white">Firefly 첫 12개월 50% 할인</text><text x="400" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="white">대한민국 신규 적격 구독자 · 2026년 10월 7일까지</text><rect x="32" y="134" width="352" height="218" rx="18" fill="white" stroke="#fdba74" stroke-width="2"/><text x="208" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9a3412">표준 생성 기능</text><text x="208" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#431407">이미지 생성 · 생성형 채우기</text><text x="208" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#431407">생성형 확장 · 텍스트를 벡터로</text><rect x="98" y="273" width="220" height="48" rx="24" fill="#ffedd5"/><text x="208" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#c2410c">무제한 이용</text><rect x="416" y="134" width="352" height="218" rx="18" fill="white" stroke="#c4b5fd" stroke-width="2"/><text x="592" y="173" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#5b21b6">프리미엄 기능</text><text x="592" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#2e1065">비디오 · 오디오 · 번역</text><text x="592" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#2e1065">Google · OpenAI 등 파트너 모델</text><rect x="482" y="273" width="220" height="48" rx="24" fill="#ede9fe"/><text x="592" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fon