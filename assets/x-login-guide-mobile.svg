<svg xmlns="http://www.w3.org/2000/svg" width="440" height="620" viewBox="0 0 440 620"><rect width="440" height="620" rx="22" fill="#f8fafc"/><text x="220" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0f172a">X 로그인 복구 순서</text><g font-family="Arial,sans-serif"><rect x="28" y="80" width="384" height="100" rx="17" fill="#e0f2fe"/><text x="50" y="120" font-size="20" font-weight="700" fill="#075985">1. 앱·웹 비교</text><text x="50" y="151" font-size="16" fill="#0c4a6e">비공개 창·VPN·확장 확인</text><rect x="28" y="205" width="384" height="100" rx="17" fill="#ede9fe"/><text x="50" y="245" font-size="20" font-weight="700" fill="#5b21b6">2. 계정 정보 확인</text><text x="50" y="276" font-size="16" fill="#4c1d95">사용자 아이디·이메일·전화번호</text><rect x="28" y="330" width="384" height="100" rx="17" fill="#dcfce7"/><text x="50" y="370" font-size="20" font-weight="700" fill="#166534">3. 최신 코드 확인</text><text x="50" y="401" font-size="16" fill="#14532d">가장 최근 코드 · 60분 유효</text><rect x="28" y="465" width="384" height="105" rx="17" fill="white" stroke="#cbd5e1"/><text x="220" y="505" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">안 되면 X 공식 지원</text><text x="220" y="536" text-anchor="middle" font-size="15" fill="#475569">인증 코드는 누구에게도 전달 금지</text></g></svg>
