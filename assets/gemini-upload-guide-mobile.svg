<svg xmlns="http://www.w3.org/2000/svg" width="400" height="620" viewBox="0 0 400 620" role="img" aria-labelledby="t d"><title id="t">Gemini 파일 업로드 모바일 진단</title><desc id="d">파일 오류 원인을 세로로 확인하는 흐름</desc><rect width="400" height="620" rx="22" fill="#f6f8fb"/><g font-family="Arial,sans-serif" fill="#17223b"><text x="200" y="42" text-anchor="middle" font-size="20" font-weight="700">Gemini 업로드 오류 진단</text><rect x="50" y="68" width="300" height="62" rx="16" fill="#fff" stroke="#6b5ce7" stroke-width="3"/><text x="200" y="106" text-anchor="middle" font-size="16" font-weight="700">새 채팅에 작은 파일 1개</text><path d="M200 130v24M200 246v24M200 362v24M200 478v24" stroke="#7d879a" stroke-width="3"/><rect x="45" y="154" width="310" height="92" rx="16" fill="#e8f1ff" stroke="#4b83d1" stroke-width="2"/><text x="200" y="190" text-anchor="middle" font-size="17" font-weight="700">1. 파일 기준</text><text x="200" y="219" text-anchor="middle" font-size="14">개수·용량·ZIP 내부 확인</text><rect x="45" y="270" width="310" height="92" rx="16" fill="#fff1dc" stroke="#d68a28" stroke-width="2"/><text x="200" y="306" text-anchor="middle" font-size="17" font-weight="700">2. 사용량·저장공간</text><text x="200" y="335" text-anchor="middle" font-size="14">기다리기 또는 활동 검토</text><rect x="45" y="386" width="310" height="92" rx="16" fill="#e8f7ed" stroke="#42a364" stroke-width="2"/><text x="200" y="422" text-anchor="middle" font-size="17" font-weight="700">3. 계정 권한</text><text x="200" y="451" text-anchor="middle" font-size="14">관리자·Drive 연결 확인</text><rect x="45" y="502" width="310" height="78" rx="16" fill="#fff" stroke="#7d879a" stroke-width="2"/><text x="200" y="533" text-anchor="middle" font-size="15" font-weight="700">원본 대신 필요한 사본 사용</text><text x="200" y="560" text-anchor="middle" font-size="13">민감정보는 먼저 가리기</text></g></svg>
