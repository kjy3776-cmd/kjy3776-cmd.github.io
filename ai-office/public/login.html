<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>숲 사무실 접속</title>
<link rel="icon" href="/icon.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/app.css">
<style>
  body { display: grid; place-items: center; padding: 16px; }
  .card { width: min(360px, 100%); background: var(--cream); border: 4px solid var(--wood); border-radius: 12px; padding: 20px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.3); }
  input { width: 100%; font-size: 30px; letter-spacing: 8px; text-align: center; border: 2px solid var(--wood); border-radius: 10px; padding: 8px; background: var(--paper); margin: 10px 0; }
  .err { color: var(--rose); min-height: 1.5em; margin: 0; }
</style>
</head>
<body>
<form class="card" id="f">
  <div style="font-size:40px">🌲</div>
  <h1 style="font-size:18px;margin:6px 0">꿀TMI 숲 사무실</h1>
  <p style="margin:0;color:var(--muted)">사무실 컴퓨터의 <b>📱 기기 연결</b>에 나온 6자리 숫자를 넣어 주세요.</p>
  <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required autofocus aria-label="접속 숫자">
  <p class="err" id="err"></p>
  <button class="primary" style="width:100%;padding:8px">들어가기</button>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: document.getElementById('pin').value }) });
  if (r.ok) location.href = '/';
  else document.getElementById('err').textContent = (await r.json().catch(() => ({}))).error || '접속하지 못했어요';
};
</script>
</body>
</html>
